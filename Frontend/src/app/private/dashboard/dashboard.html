<div class="layout-container">

  <!-- Sidebar -->
  <aside class="sidebar" >
    <div class="brand">
      <h1>CARBON<span>360</span></h1>
      <p>Track • Analyze • Improve</p>
    </div>

    <ul class="menu">
  <li *ngIf="isAdmin() || isCorporate()" [class.active]="isActive('user')" (click)="goTo('user')">
    Users
  </li>

  <li *ngIf="isAdmin() || isCorporate()" [class.active]="isActive('role')" (click)="goTo('role')">
    Role
  </li>
    <li *ngIf="isAdmin() || isCorporate()" [class.active]="isActive('department')" (click)="goTo('department')">
    department
  </li>  <li *ngIf="isAdmin() || isReporter()" [class.active]="isActive('vehicle')" (click)="goTo('vehicle')">
    vehicle
  </li>  <li *ngIf="isAdmin() || isReporter()" [class.active]="isActive('waste')" (click)="goTo('waste')">
    waste
  </li>
   <li *ngIf="isAdmin() || isReporter()" [class.active]="isActive('generator')" (click)="goTo('generator')">
    generator
  </li>
    </ul>
  </aside>

  <!-- Main Section -->
  <div class="main-section">

    <header class="topbar">
      <div class="left"> <button class="menu-toggle" (click)="toggleSidebar()">☰</button> </div>
      <div class="right"> <!-- Admin Icon -->
        <div class="admin-wrapper">
          <div class="admin-avatar" (click)="toggleProfile($event)"> {{ loggedInUser.charAt(0) }} </div>
          <div class="admin-dropdown" *ngIf="showProfileCard" (click)="$event.stopPropagation()">
          <h4 *ngIf="roles && roles.length > 1">Switch Role</h4>

<select *ngIf="roles && roles.length > 1"
        [(ngModel)]="selectedRole"
        (change)="onRoleChange()"
        class="role-select">

  <option *ngFor="let role of roles" [value]="role">
    {{ role }}
  </option>

</select>
            <div class="divider"></div> <button class="logout-btn" (click)="logout()">Logout</button>
          </div>
        </div>
      </div>
    </header>
    <!-- CHILD PAGES LOAD HERE -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
