<div class="layout-container">

  <!-- Sidebar -->
  <aside class="sidebar" >
    <div class="brand">
      <h1>CARBON<span>360</span></h1>
      <p>Track • Analyze • Improve</p>
    </div>

   <ul class="menu">

  <!-- ================= ADMINISTRATION ================= -->
  <li class="menu-parent">

    <div class="menu-title" (click)="toggleMenu('admin')">
      <i class="fas fa-cogs"></i>
      <span>Administration</span>
      <i class="fas fa-chevron-down arrow"
         [class.rotate]="openedMenu === 'admin'"></i>
    </div>

   <ul class="submenu" *ngIf="openedMenu === 'admin'">

  <li *ngIf="isAdmin() || isCorporate()"
      (click)="goTo('user')"
      [class.active-link]="isActive('/user')">
    <i class="fas fa-user-cog"></i>
    User Administration
  </li>

  <li *ngIf="isAdmin() || isCorporate()"
      (click)="goTo('role')"
      [class.active-link]="isActive('/role')">
    <i class="fas fa-shield-alt"></i>
    Access Control
  </li>

  <li *ngIf="isAdmin() || isCorporate()"
      (click)="goTo('department')"
      [class.active-link]="isActive('/department')">
    <i class="fas fa-sitemap"></i>
    Organizational Units
  </li>

</ul>
  </li>


  <!-- ================= EMISSION MODULES ================= -->
  <li class="menu-parent">

    <div class="menu-title" (click)="toggleMenu('emission')">
      <i class="fas fa-leaf"></i>
      <span>Emission Modules</span>
      <i class="fas fa-chevron-down arrow"
         [class.rotate]="openedMenu === 'emission'"></i>
    </div>

    <ul class="submenu" *ngIf="openedMenu === 'emission'">

      <li *ngIf="isAdmin() || isReporter()"
          routerLink="/vehicle"
          routerLinkActive="active-link">
        <i class="fas fa-truck"></i>
        Fleet & Transport
      </li>

      <li *ngIf="isAdmin() || isReporter()"
          routerLink="/waste"
          routerLinkActive="active-link">
        <i class="fas fa-recycle"></i>
        Waste & Disposal
      </li>

      <li *ngIf="isAdmin() || isReporter()"
          routerLink="/generator"
          routerLinkActive="active-link">
        <i class="fas fa-bolt"></i>
        Power Generation
      </li>

    </ul>
  </li>

</ul>
  </aside>

  <!-- Main Section -->
  <div class="main-section">

    <header class="topbar">
      <div class="left"> <button class="menu-toggle" (click)="toggleSidebar()">☰</button> </div>
      <div class="right"> <!-- Admin Icon -->
        <div class="admin-wrapper">
          <div class="admin-avatar" (click)="toggleProfile($event)"> {{ loggedInUser.charAt(0) }} </div>
          <div class="admin-dropdown" *ngIf="showProfileCard" (click)="$event.stopPropagation()">
          <h4 *ngIf="roles && roles.length > 1">Switch Role</h4>

<select *ngIf="roles && roles.length > 1"
        [(ngModel)]="selectedRole"
        (change)="onRoleChange()"
        class="role-select">

  <option *ngFor="let role of roles" [value]="role">
    {{ role }}
  </option>

</select>
            <div class="divider"></div> <button class="logout-btn" (click)="logout()">Logout</button>
          </div>
        </div>
      </div>
    </header>
    <!-- CHILD PAGES LOAD HERE -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
