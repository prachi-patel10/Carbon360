<div class="generator-ecpage">

  <!-- ================= INPUT FORM ================= -->
  <div class="card form-card">
    <form [formGroup]="operationForm" (ngSubmit)="submitOperation()">

      <div class="form-row">

        <!-- Generator -->
      <div class="form-group">
<label>Generator</label>

<select formControlName="GeneratorId">
<option [ngValue]="null">-- Select Generator --</option>

<option *ngFor="let g of generators" [ngValue]="g.generatorId">
{{ g.generatorName }}
</option>
</select>

<div class="error" *ngIf="isInvalid('GeneratorId')">
Generator is required
</div>

</div>

      <div class="form-group">
<label>Start Date & Time</label>

<input type="datetime-local"
formControlName="StartTime"
class="form-control" />

<div class="error" *ngIf="isInvalid('StartTime')">

<span *ngIf="operationForm.get('StartTime')?.errors?.['required']">
Start time is required
</span>

<span *ngIf="operationForm.get('StartTime')?.errors?.['futureDate']">
Future date/time not allowed
</span>

</div>

</div>

        <!-- End Time -->
       <div class="form-group">
<label>End Date & Time</label>

<input type="datetime-local"
formControlName="EndTime"
class="form-control" />

<div class="error" *ngIf="isInvalid('EndTime')">

<span *ngIf="operationForm.get('EndTime')?.errors?.['required']">
End time is required
</span>

<span *ngIf="operationForm.get('EndTime')?.errors?.['futureDate']">
Future date/time not allowed
</span>

</div>

</div>

        <!-- Load Factor -->
       <div class="form-group">
<label>Load Factor</label>

<input type="number" formControlName="LoadFactor" placeholder="0"/>

<div class="error" *ngIf="isInvalid('LoadFactor')">

<span *ngIf="operationForm.get('LoadFactor')?.errors?.['required']">
Load Factor is required
</span>

<span *ngIf="operationForm.get('LoadFactor')?.errors?.['min']">
Load Factor cannot be negative
</span>

</div>

</div>

        <!-- Fuel Consumed -->
        <div class="form-group">
<label>Fuel Consumed (Liters)</label>

<input type="number" formControlName="FuelConsumedLiters" placeholder="0"/>

<div class="error" *ngIf="isInvalid('FuelConsumedLiters')">

<span *ngIf="operationForm.get('FuelConsumedLiters')?.errors?.['required']">
Fuel Consumed is required
</span>

<span *ngIf="operationForm.get('FuelConsumedLiters')?.errors?.['min']">
Fuel cannot be negative
</span>

</div>

</div>
      </div>

      <div class="form-buttons">
        <button type="submit" class="btn-primary">
          {{ !operationForm.value.OperationId ? 'Save' : 'Update' }}
        </button>

        <button type="button"
                class="btn-secondary"
                (click)="resetForm()">
          Reset
        </button>
      </div>

    </form>
  </div>

</div>
