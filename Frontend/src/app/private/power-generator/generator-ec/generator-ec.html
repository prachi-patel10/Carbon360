<div class="container py-4">
  <form [formGroup]="operationForm" class="row g-3">

    <!-- Generator -->
   <div class="mb-3">
  <label class="form-label">Generator</label>
  <input type="text" class="form-control" [value]="generatorName" readonly>
</div>

    <!-- Start & End Time -->
    <div class="col-md-3">
      <label class="form-label fw-bold">Start Date & Time</label>
      <input type="datetime-local" class="form-control" formControlName="StartTime">
    </div>

    <div class="col-md-3">
      <label class="form-label fw-bold">End Date & Time</label>
      <input type="datetime-local" class="form-control" formControlName="EndTime">
    </div>

    <!-- Load Factor -->
    <div class="col-md-3">
      <label class="form-label fw-bold">Load Factor</label>
      <input type="number" class="form-control" formControlName="LoadFactor">
    </div>

    <!-- Fuel Consumed -->
    <div class="col-md-3">
      <label class="form-label fw-bold">Fuel Consumed (Liters)</label>
      <input type="number" class="form-control" formControlName="FuelConsumedLiters">
    </div>

  </form>

  <!-- Calculations Card -->
  <div class="card mt-4">
    <div class="card-body">
      <h5>Total Calculation</h5>
      <div><strong>Run Hours:</strong> {{ totalCalculations?.runHours || 0 }}</div>
      <div><strong>Total Fuel (Liters):</strong> {{ totalCalculations?.totalFuel || 0 }}</div>
      <div><strong>Average Load Factor:</strong> {{ totalCalculations?.avgLoadFactor || 0 }}</div>
      <div><strong>Total Emission (kg CO2 eq):</strong> {{ totalCalculations?.totalEmission || 0 }}</div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="mt-3">
    <div *ngIf="showApproveReject" class="btn-group">
      <button type="button" class="btn btn-success" (click)="approve()">Approve</button>
      <button type="button" class="btn btn-danger" (click)="reject()">Reject</button>
    </div>

    <button type="button" class="btn btn-warning mt-2" *ngIf="showResubmit" (click)="resubmit()">Resubmit</button>
  </div>
</div>
