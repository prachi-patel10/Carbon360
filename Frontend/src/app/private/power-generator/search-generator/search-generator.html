<div class="generator-report-container py-4">
  <div class="container">
    <!-- Filters -->
    <div class="card filter-card mb-4">
      <div class="card-body p-4">
        <form class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label fw-bold">
              <i class="fas fa-gas-pump icon-addon"></i> Fuel Type
            </label>
            <select class="form-select" (change)="onFuelTypeChange($event)">
              <option value="All">All Fuel Types</option>
              <option *ngFor="let fuel of fuelTypes" [value]="fuel.fuel_name">
                {{ fuel.fuel_name }}
              </option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold"><i class="fas fa-calendar-alt icon-addon"></i> Start Time</label>
            <input type="datetime-local" class="form-control" (change)="onStartTimeChange($event)" />
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold"><i class="fas fa-calendar-check icon-addon"></i> End Time</label>
            <input type="datetime-local" class="form-control" (change)="onEndTimeChange($event)" />
          </div>

          <div class="col-md-3">
            <button type="button" class="btn btn-filter btn-primary w-100" (click)="applyFilters()">
              <i class="fas fa-filter me-2"></i>Apply Filters
            </button>
          </div>

          <div class="col-md-12 mt-3">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
              <input type="text" class="form-control border-start-0"
                placeholder="Quick search by ID or Generator Name..." (input)="onSearch($event)" />
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Table -->
    <div class="card table-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th (click)="sortBy('generatorName')" style="cursor:pointer">
                Generator
              </th>

              <th (click)="sortBy('entryDate')" style="cursor:pointer">
                Entry Date
              </th>

              <th (click)="sortBy('startTime')" style="cursor:pointer">
                Start DateTime
              </th>

              <th (click)="sortBy('endTime')" style="cursor:pointer">
                End DateTime
              </th>

              <th (click)="sortBy('loadFactor')" style="cursor:pointer">
                Load Factor (%)
              </th>

              <th (click)="sortBy('fuelConsumedLiters')" style="cursor:pointer">
                Fuel (L)
              </th>

              <th>
                Action
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let e of filteredEmissions()">
              <td>{{ e.generatorName }}</td>
              <!-- <td>{{ e.entryDate | date:'dd-MMM-yyyy HH:mm' : 'UTC' }}</td> -->
              <td>{{ e.entryDate | date:'dd-MMM-yyyy' : 'UTC' }}</td>
              <td>{{ e.startTime | date:'short' }}</td>
              <td>{{ e.endTime | date:'short' }}</td>
              <!-- <td>{{ e.startTime | date:'hh:mm a' }}</td>
              <td>{{ e.endTime | date:'hh:mm a' }}</td> -->
              <td>{{ e.loadFactor }}%</td>
              <td>{{ e.fuelConsumedLiters }}</td>
              <!-- <td>{{ e.totalEmission }}</td> -->
              <td>
                <button (click)="goToDetail(e.operationId)">
                  <i class="fas fa-eye"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>


  </div>
</div>
