<div class="container">

  <!-- ================= TABLE ================= -->
  <div class="table-responsive">

    <div class="container mt-4">
      <h3>Generator Operations</h3>

      <table class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Date</th>
            <th>Fuel Type</th>
            <th>Run Hours</th>
            <th>Load Factor</th>
            <!-- <th>Fuel Consumed</th> -->
            <th>Total Emission</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of data()">
            <td>{{ item.name }}</td>
            <td>{{ item.opDate | date:'shortDate' }}</td>
            <td>{{ item.fuelType }}</td>
            <td>{{ item.runHours }}</td>
            <td>{{ item.loadFactor }}</td>
            <!-- <td>{{ item.fuelConsumed }}</td> -->
            <td>{{ item.totalEmission }}</td>
            <td>
              <button class="btn btn-sm btn-primary" (click)="edit(item)">
                <i class="fas fa-edit"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ================= PAGINATION ================= -->
  <div class="pagination-container">

    <div class="page-size">
      <label>Rows per page:</label>
      <select (change)="changePageSize($event)">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
    </div>

    <div class="pagination">
      <button (click)="goToPage(currentPage()-1)" [disabled]="currentPage()===1">Prev</button>
      <span>Page {{currentPage()}} of {{totalPages()}}</span>
      <button (click)="goToPage(currentPage()+1)" [disabled]="currentPage()===totalPages()">Next</button>
    </div>

  </div>

</div>
