<div class="container">

  <!-- ================= CREATE / EDIT FORM ================= -->
  <div class="card">

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
      <div class="form-group">
        <label>Site Name</label>
        <input type="text" placeholder="Enter Site Name" formControlName="siteName" />
      </div>

      <div class="form-group">
        <label>Building Name</label>
        <input type="text" placeholder="Enter Building Name" formControlName="buildingName" />
      </div>

      <div class="form-group">
        <label>City</label>
        <input type="text" placeholder="Enter City" formControlName="city" />
      </div>

      <div class="form-group">
        <label>State</label>
        <input type="text" placeholder="Enter State" formControlName="state" />
      </div>

      <div class="form-group">
        <label>Department</label>
        <select formControlName="departmentId">
          <option [ngValue]="null" disabled selected hidden>Select Department</option>
          <option *ngFor="let dept of departments" [ngValue]="dept.departmentId">{{ dept.departmentName }}</option>
        </select>
      </div>

      <div class="form-actions">
        <div class="status-toggle">
          <span>Active</span>
          <label class="switch">
            <input type="checkbox" formControlName="isActive" />
            <span class="slider"></span>
          </label>
        </div>
        <button type="submit" class="save-btn">
          {{ editingSiteId ? 'Update' : 'Save' }}
        </button>
        <!-- <button type="button" class="cancel-btn" (click)="form.reset({ isActive: true }); editingSiteId=null;">Clear</button> -->
      </div>
    </form>
  </div>

  <!-- ================= SEARCH + TABLE ================= -->
  <div class="card">
    <div class="search-row">
      <input type="text" class="search-input" placeholder="Search by any column..." [(ngModel)]="searchText"
        (input)="applySearch()" />
      <div class="search-right">
        <div class="status-toggle">
          <span>Active Only</span>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="isActiveFilter" (change)="applySearch()" />
            <span class="slider"></span>
          </label>
        </div>
        <button type="button" class="filter-btn" (click)="openFilterModal()">Filter</button>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
         <tr>
          <th (click)="sort('siteName')">Site Name</th>
          <th (click)="sort('buildingName')">Building Name</th>
          <th (click)="sort('city')">City</th>
          <th (click)="sort('state')">State</th>
          <th (click)="sort('departmentId')">Department</th>
          <th (click)="sort('isActive')">Status</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
          <tr *ngFor="let site of siteList">
            <td>{{ site.siteName }}</td>
            <td>{{ site.buildingName }}</td>
            <td>{{ site.city }}</td>
            <td>{{ site.state }}</td>
            <td>{{ site.departmentName }}</td>
            <td>
              <label class="switch">
                <input type="checkbox" [checked]="site.isActive" (change)="toggleStatus(site)" />
                <span class="slider"></span>
              </label>
            </td>
            <td class="actions">
              <button class="edit-btn" (click)="edit(site)">Edit</button>
              <button class="delete-btn" (click)="delete(site)">Delete</button>
            </td>
          </tr>
          <tr *ngIf="siteList.length === 0">
            <td colspan="7" class="no-data">No records found</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- ================= PAGINATION ================= -->
    <div class="pagination-info">
      <span>Total Records: {{ totalRecords }}</span>
      <div class="pagination-controls">
        <button (click)="prevPage()" [disabled]="pageNumber===1">Previous</button>
        <span>Page {{ pageNumber }} of {{ totalPages }}</span>
        <button (click)="nextPage()" [disabled]="pageNumber===totalPages">Next</button>
        <label for="pageSize">Page Size:</label>
        <select id="pageSize" [value]="pageSize" (change)="changePageSize($event)">
          <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ================= FILTER MODAL ================= -->
  <div class="filter-overlay" *ngIf="filterModalOpen()">
    <div class="filter-modal">

      <!-- Header -->
      <div class="filter-header">
        <h3>Filter Site Locations</h3>
        <button type="button" class="close-btn" (click)="closeFilter()">✖</button>
      </div>

      <!-- Body -->
      <div class="filter-body">

        <div class="form-row">

          <!-- Site Name Multi Select -->
          <div class="form-group half-width">
            <label>Site Name</label>
            <div class="multi-select-box">
              <div *ngFor="let site of siteList" class="checkbox-item">
                <label>
                  <input type="checkbox" [checked]="selectedSiteNames.includes(site.siteName)"
                    (change)="toggleSiteName(site.siteName)" />
                  <span>{{ site.siteName }}</span>
                </label>
              </div>
            </div>
          </div>

          <!-- City Name Multi Select -->
          <div class="form-group half-width">
            <label>City Name</label>
            <div class="multi-select-box">
              <div *ngFor="let site of siteList" class="checkbox-item">
                <label>
                  <input type="checkbox" [checked]="selectedCityNames.includes(site.city)"
                    (change)="toggleCityName(site.city)" />
                  <span>{{ site.city }}</span>
                </label>
              </div>
            </div>
          </div>

        </div>

        <!-- Footer -->
        <div class="filter-footer">
          <button type="button" class="reset-btn" (click)="resetFilterModal()">Reset</button>
          <button type="button" class="apply-btn" (click)="applyFilter()">Apply Filter</button>
        </div>

      </div>
    </div>
  </div>
</div>
