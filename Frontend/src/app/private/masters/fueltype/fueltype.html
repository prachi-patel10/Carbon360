<div class="container">

  <!-- 🔹 Create Fuel -->
  <div class="card">
    <div class="form-grid">

      <input type="text"
             placeholder="Fuel Name"
             [(ngModel)]="newFuel.fuel_name" />

      <input type="text"
             placeholder="Fuel Description"
             [(ngModel)]="newFuel.fuel_Desc" />

      <!-- ✅ Applicable Toggle -->
      <div class="toggle-group">
        <label>Generator Applicable</label>

        <label class="switch">
          <input type="checkbox"
                 [(ngModel)]="newFuel.isapplicable">
          <span class="slider round green"></span>
        </label>

        <span class="toggle-text">
          {{ newFuel.isapplicable ? 'Applicable' : 'Not Applicable' }}
        </span>
      </div>

    </div>

    <div class="button-row">
      <button class="btn-save" (click)="createFuel()">Save</button>
      <button class="btn-reset" (click)="resetForm()">Reset</button>
    </div>
  </div>


  <!-- 🔹 Fuel List -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Generator</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let fuel of fuels">

          <td>{{ fuel.fuel_name }}</td>
          <td>{{ fuel.fuel_Desc }}</td>

          <!-- ✅ Generator Toggle -->
          <td>
            <label class="switch">
             <input type="checkbox"
         [checked]="fuel.isapplicable"
         (change)="confirmApplicableChange($event, fuel)" />
              <span class="slider round green"></span>
            </label>
          </td>

          <!-- ✅ Status Toggle -->
          <td>
            <label class="switch">
  <input type="checkbox"
       [checked]="fuel.isActive"
       (click)="confirmStatusChange($event, fuel)" />
              <span class="slider round blue"></span>
            </label>
          </td>

          <!-- ✅ Actions -->
          <td class="action-buttons">
            <button class="btn-edit" (click)="editFuel(fuel)">Edit</button>
            <button class="btn-delete" (click)="deleteFuel(fuel)">Delete</button>
          </td>

        </tr>
      </tbody>
    </table>

  </div>

</div>
