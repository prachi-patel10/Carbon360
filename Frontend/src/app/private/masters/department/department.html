<div class="container">

  <!-- ================= CREATE / EDIT DEPARTMENT FORM ================= -->
  <div class="card">
    <form [formGroup]="departmentForm" (ngSubmit)="submitdept()" class="form-grid">

      <!-- Department Name -->
      <div class="form-group">
        <label>Department Name</label>
        <input type="text" formControlName="DepartmentName" placeholder="Enter Department Name">

        <small class="error-text"
          *ngIf="departmentForm.get('DepartmentName')?.touched && departmentForm.get('DepartmentName')?.invalid">
          Department Name is required
        </small>
      </div>

      <!-- Status -->
     <div class="form-actions">
        <div class="status-toggle">
          <span>Active</span>
          <label class="switch">
            <input type="checkbox" formControlName="IsActive">
            <span class="slider"></span>
          </label>
        </div>
</div>
      <!-- Buttons -->
      <div class="form-actions">
        <button type="submit" class="save-btn">
          {{ !departmentForm.value.DepartmentId ? 'Save' : 'Update' }}
        </button>

               <button type="button" class="reset-btn" (click)="resetForm()">Reset</button>

      </div>

    </form>
  </div>

  <!-- ================= SEARCH + TABLE + PAGINATION ================= -->
  <div class="card">

    <!-- Search Row -->
    <div class="search-row">

      <div class="search-left">
        <input type="text"
               class="search-input"
               placeholder="Quick Search"
               formControlName="searchText"
               [formGroup]="searchForm">
      </div>

      <div class="search-right">

        <!-- Active Filter -->
        <div class="status-toggle">
          <span>Active Only</span>
          <label class="switch">
            <input type="checkbox"
                   [checked]="onlyActive()"
                   (change)="onActiveFilterChange($event)">
            <span class="slider"></span>
          </label>
        </div>

        <!-- <button class="delete-btn" (click)="clearSearch()">Clear</button> -->
         <!-- Filter Button -->
        <button class="filter-btn" (click)="openDepartmentFilter()">
          Filter
        </button>

      </div>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Department Name</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let d of departments()">
            <td>{{ d.DepartmentName }}</td>

            <td>
              <label class="switch">
                <input type="checkbox"
                       [checked]="d.IsActive"
                       (change)="toggleActive(d)">
                <span class="slider"></span>
              </label>
            </td>

            <td class="actions">
              <button class="edit-btn" (click)="edit(d)">Edit</button>
              <button class="delete-btn" (click)="deleteUI(d)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- ================= FILTER MODAL ================= -->

<div class="filter-overlay" *ngIf="departmentFilterModalOpen()">

  <div class="filter-modal">

    <!-- Header -->
    <div class="filter-header">
      <h3>Filter Department</h3>
      <button class="close-btn" (click)="closeDepartmentFilter()">✖</button>
    </div>

    <!-- Body -->
    <div class="filter-body">

      <div class="form-group">
        <label>Select Department</label>

        <div class="multi-select-container">

          <div *ngFor="let d of departments()" class="checkbox-item">

            <label>
              <input type="checkbox"
                     [checked]="selectedDepartmentIds.includes(d.DepartmentId)"
                     (change)="toggleDepartmentFilter(d.DepartmentId)" />

              <span>{{ d.DepartmentName }}</span>

            </label>

          </div>

        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="filter-footer">
      <button class="apply-btn" (click)="ResetDepartmentFilter()">
        RESET
      </button>
      <button class="apply-btn" (click)="applyDepartmentFilter()">
        Apply Filter
      </button>

    </div>

  </div>

</div>

    <!-- Pagination -->
 <!-- Pagination -->
<div class="pagination-info">
  <span>Total Records: {{ totalRecords() }}</span>

  <div class="pagination-controls">
    <!-- Previous Button -->
    <button (click)="previousPage()" [disabled]="currentPage() === 1">
      Previous
    </button>

    <!-- Page Info -->
    <span>Page {{ currentPage() }} of {{ totalPages() }}</span>

    <!-- Next Button -->
    <button (click)="nextPage()" [disabled]="currentPage() === totalPages()">
      Next
    </button>

    <!-- Page Size Selector -->
    <label for="pageSize">Page Size:</label>
    <select
      id="pageSize"
      [value]="requestedRecords()"
      (change)="onRecordsChange($event)"
    >
      <option *ngFor="let size of pageSizeOptions" [value]="size">
        {{ size }}
      </option>
    </select>
  </div>
</div>

</div>
