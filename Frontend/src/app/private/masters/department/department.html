<div class="container">

  <!-- ================= CREATE / EDIT DEPARTMENT FORM ================= -->
  <div class="card">
    <form [formGroup]="departmentForm" (ngSubmit)="submitdept()" class="form-grid">

      <!-- Department Name -->
      <div class="form-group">
        <label>Department Name</label>
        <input type="text" formControlName="DepartmentName" placeholder="Enter department name">

        <small class="error-text"
          *ngIf="departmentForm.get('DepartmentName')?.touched && departmentForm.get('DepartmentName')?.invalid">
          Department Name is required
        </small>
      </div>

      <!-- Status -->
      <div class="form-group">
        <label>Status</label>

        <div class="status-toggle">
          <label class="switch">
            <input type="checkbox" formControlName="IsActive">
            <span class="slider"></span>
          </label>

          <span>
            {{ departmentForm.get('IsActive')?.value ? 'Active' : 'Inactive' }}
          </span>
        </div>
      </div>

      <!-- Buttons -->
      <div class="form-actions">
        <button type="submit" class="save-btn">
          {{ !departmentForm.value.DepartmentId ? 'Save' : 'Update' }}
        </button>

        <button type="button" class="btn-secondary" (click)="resetForm()">
          Reset
        </button>
      </div>

    </form>
  </div>

  <!-- ================= SEARCH + TABLE + PAGINATION ================= -->
  <div class="card">

    <!-- Search Row -->
    <div class="search-row">

      <div class="search-left">
        <input type="text"
               class="search-input"
               placeholder="Search department..."
               formControlName="searchText"
               [formGroup]="searchForm">
      </div>

      <div class="search-right">

        <!-- Active Filter -->
        <div class="status-toggle">
          <span>Active Only</span>
          <label class="switch">
            <input type="checkbox"
                   [checked]="onlyActive()"
                   (change)="onActiveFilterChange($event)">
            <span class="slider"></span>
          </label>
        </div>

        <button class="delete-btn" (click)="clearSearch()">Clear</button>

      </div>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Department Name</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let d of departments()">
            <td>{{ d.DepartmentName }}</td>

            <td>
              <label class="switch">
                <input type="checkbox"
                       [checked]="d.IsActive"
                       (change)="toggleActive(d)">
                <span class="slider"></span>
              </label>
            </td>

            <td class="actions">
              <button class="edit-btn" (click)="edit(d)">Edit</button>
              <button class="delete-btn" (click)="deleteUI(d)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
  <!-- Pagination -->
<div class="pagination-bar">

  <button 
    (click)="previousPage()" 
    [disabled]="currentPage() === 1">
    Previous
  </button>

  <span class="page-info">
    Page {{ currentPage() }} of {{ totalPages() }}
  </span>

  <button 
    (click)="nextPage()" 
    [disabled]="currentPage() === totalPages()">
    Next
  </button>

  <div class="page-size">
    <span>Page Size:</span>
    <select (change)="onRecordsChange($event)">
      <option value="5">5</option>
      <option value="10">10</option>
      <option value="20">20</option>
    </select>
  </div>

</div>

  </div>

</div>
