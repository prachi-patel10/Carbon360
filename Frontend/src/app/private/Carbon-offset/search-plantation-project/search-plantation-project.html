<div class="generator-report-container py-4 vehicle-search-container">
    <div class="container">

        <!-- ── Filter Card ──────────────────────────────────────────── -->
        <div class="card filter-card mb-4">
            <div class="card-body p-4">
                <form class="filter-form">

                    <!-- Header -->
                    <div class="filter-header">
                        <div class="filter-header-icon">
                            <i class="fas fa-sliders-h"></i>
                        </div>
                        <span class="filter-header-label">Filters</span>
                    </div>

                    <!-- Row: Search + Reset -->
                    <div class="filter-row-search">
                        <div class="search-wrap">
                            <i class="fas fa-search search-icon"></i>
                            <input type="text" class="search-input" placeholder="Search by project name"
                                [value]="searchText()" (input)="onSearch($event)" />
                        </div>
                        <button type="button" class="btn-reset" (click)="resetFilters()">
                            <i class="fas fa-rotate-left"></i> Reset Filters
                        </button>
                    </div>

                </form>
            </div>
        </div>

        <!-- ── Table Card ───────────────────────────────────────────── -->
        <div class="card table-card">
            <div class="table-responsive">
                <table class="table align-middle mb-0 vehicle-table">
                    <thead>
                        <tr>
                            <th class="col-actions">Actions</th>
                            <th (click)="sort('ProjectName')" class="sortable">
                                Project Name <span class="sort-icon">{{ getSortIcon('ProjectName') }}</span>
                            </th>
                            <th (click)="sort('FinancialYear')" class="sortable">
                                Financial Year <span class="sort-icon">{{ getSortIcon('FinancialYear') }}</span>
                            </th>
                            <!-- <th>Status</th> -->
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let row of paginatedData()">
                            <td class="col-actions">
                                <div class="action-btns">
                                    <button class="btn-open" (click)="openRecord(row.offsetEntryId)"
                                        title="View Details">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn-pdf-download" (click)="downloadPdf(row.offsetEntryId)"
                                        [disabled]="isLoading(row.offsetEntryId)"
                                        [title]="isLoading(row.offsetEntryId) ? 'Generating...' : 'Download PDF'">
                                        <i class="fas fa-file-pdf"
                                            [style.display]="isLoading(row.offsetEntryId) ? 'none' : 'flex'"></i>
                                        <i class="fas fa-spinner fa-spin"
                                            [style.display]="isLoading(row.offsetEntryId) ? 'flex' : 'none'"></i>
                                    </button>
                                </div>
                            </td>
                            <td class="project-name-col">{{ row.projectName }}</td>
                            <td>{{ row.financialYear }}</td>
                        </tr>
                        <tr *ngIf="paginatedData().length === 0">
                            <td colspan="4" class="text-center py-4 text-muted">No records found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination Footer -->
            <div class="table-footer">
                <div class="total-records">Total Records : <b>{{ totalRecords() }}</b></div>
                <div class="page-size">
                    Show
                    <select [value]="pageSize" (change)="changePageSize($event)">
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <div class="pagination">
                    <button (click)="goToPage(currentPage() - 1)" [disabled]="currentPage() === 1">Prev</button>
                    <span class="page-info">Page {{ currentPage() }} of {{ totalPages() }}</span>
                    <button (click)="goToPage(currentPage() + 1)"
                        [disabled]="currentPage() === totalPages()">Next</button>
                </div>
            </div>
        </div>

    </div>
</div>
