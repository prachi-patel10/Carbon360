<div class="container">

  <!-- ================= NGO FORM ================= -->
  <div class="card">
    <form [formGroup]="ngoForm" (ngSubmit)="onSubmit()" class="form-grid">

      <!-- NGO Name -->
      <div class="form-group">
        <label>
          NGO Name <span class="required">*</span>
        </label>

        <input type="text"
               formControlName="ngoName"
               placeholder="Enter NGO Name"
/>
        <small class="error-text"
          *ngIf="ngoForm.get('ngoName')?.touched && ngoForm.get('ngoName')?.invalid">
          NGO Name is required
        </small>
      </div>

      <!-- Contact Person -->
      <div class="form-group">
        <label>Contact Person</label>
        <input type="text" formControlName="contactPerson">
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email">
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label>Phone</label>
        <input type="text" formControlName="phone">
      </div>

      <!-- Location -->
      <div class="form-group">
        <label>Location</label>
        <input type="text" formControlName="location">
      </div>

      <!-- STATUS + BUTTONS (Same Row Style) -->
      <div class="form-actions">

        <!-- Toggle -->
        <div class="status-toggle">
          <span>Active</span>
          <label class="switch">
            <input type="checkbox" formControlName="isActive">
            <span class="slider"></span>
          </label>
        </div>

        <!-- Buttons -->
        <button type="submit" class="save-btn">
          {{ !ngoForm.value.ngoId ? 'Save' : 'Update' }}
        </button>

        <button type="button" class="reset-btn" (click)="reset()">
          Reset
        </button>

      </div>

    </form>
  </div>

</div>
