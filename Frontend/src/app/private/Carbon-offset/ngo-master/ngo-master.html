<div class="ngo-container">

  <div class="card">
    <form [formGroup]="ngoForm" (ngSubmit)="onSubmit()" class="form-grid">

      <!-- NGO Name -->
      <div class="form-group">
        <label>
          NGO Name <span class="required">*</span>
        </label>

        <input type="text" formControlName="ngoName" placeholder="Enter NGO Name">

        @if (ngoForm.get('ngoName')?.touched && ngoForm.get('ngoName')?.invalid) {
          <small class="error-text">
            NGO Name is required
          </small>
        }
      </div>

      <!-- Contact Person -->
      <div class="form-group">
        <label>Contact Person</label>
        <input type="text" formControlName="contactPerson" placeholder="Enter contact person">
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Enter email">
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label>Phone</label>
        <input type="text" formControlName="phone" placeholder="Enter phone number">
      </div>

      <!-- Location -->
      <div class="form-group">
        <label>Location</label>
        <input type="text" formControlName="location" placeholder="Enter location">
      </div>

      <!-- Toggle -->
      <div class="form-actions">
        <div class="status-toggle">
          <span>Active</span>
          <label class="switch">
            <input type="checkbox" >
            <span class="slider"></span>
          </label>
        </div>
</div>

      <!-- Buttons -->
      <div class="form-group full-width">
        <div class="btn-group">
          <button type="submit" class="btn-save">
            {{ !ngoForm.value.projectId ? 'Save' : 'Update' }}
          </button>

          <button type="button" class="btn-reset" (click)="reset()">
            Reset
          </button>
        </div>
      </div>

    </form>

  </div>

</div>
