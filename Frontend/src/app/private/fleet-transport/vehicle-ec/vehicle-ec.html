<div class="emission-page">
  <form [formGroup]="tripForm" (ngSubmit)="submitTrip()" class="card">

    <div class="card-title">Vehicle Trip Emission</div>

    <div class="form-row">
      <div class="form-group">
        <label>Vehicle</label>
        <select formControlName="vehicle_id">
          <option value="">Select Vehicle</option>
          <option *ngFor="let v of vehicles" [value]="v.vehicle_id">{{ v.vehicle_number }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>From City</label>
        <!-- <select formControlName="fromCityId">
          <option value="">Select City</option>
          <option *ngFor="let c of cities" [value]="c.id">{{ c.cityName }}</option>
        </select> -->
        <select formControlName="fromCityId">
          <option value="">Select From City</option>
          <option *ngFor="let city of cities" [value]="city.cityId">
            {{ city.cityName }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>To City</label>
        <!-- <select formControlName="toCityId">
          <option value="">Select City</option>
          <option *ngFor="let c of cities" [value]="c.id">{{ c.cityName }}</option>
        </select> -->
        <select formControlName="toCityId">
          <option value="">Select To City</option>
          <option *ngFor="let city of cities" [value]="city.cityId">
            {{ city.cityName }}
          </option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Fuel Type</label>
        <input type="text" formControlName="fuelType" readonly class="modern-input">
      </div>

      <div class="form-group">
        <label>Distance (KM)</label>
        <input type="number" formControlName="distanceKm">
      </div>

      <div class="form-group">
        <label>Fuel Consumed (Ltr)</label>
        <input type="number" formControlName="fuelConsumedLtr">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Trip Start Date</label>
        <input type="datetime-local" formControlName="tripStartDateTime" [max]="todayDateTime" class="modern-input">
      </div>

      <div class="form-group">
        <label>Trip End Date</label>
        <input type="datetime-local" formControlName="tripEndDateTime" [max]="todayDateTime" class="modern-input">
      </div>

      <div class="form-group">
        <label>Trip Duration</label>
        <input type="text" [value]="tripDuration" readonly class="modern-input">
      </div>
    </div>

    <div class="card-title">Emission Factors (KG)</div>

    <div class="form-row">
      <div class="form-group">
        <label>CO₂ Factor</label>
        <input type="number" formControlName="co2Factor" readonly>
      </div>

      <div class="form-group">
        <label>NO₂ Factor</label>
        <input type="number" formControlName="no2Factor" readonly>
      </div>

      <div class="form-group">
        <label>CH₄ Factor</label>
        <input type="number" formControlName="ch4Factor" readonly>
      </div>
    </div>

    <div class="form-buttons">
      <button type="submit" class="btn-primary">Submit Trip</button>
      <button type="button" class="btn-secondary" (click)="resetForm()">Reset</button>
    </div>
  </form>

  <!-- RESULTS SECTION -->
  <div class="card result-card" *ngIf="result">

    <div class="card-title">Emission Results (KG)</div>

    <div class="result-grid">

      <div class="result-box">
        <h4>Total CO₂</h4>
        <p>{{ result?.totalCo2 }}</p>
      </div>

      <div class="result-box">
        <h4>Total NO₂</h4>
        <p>{{ result?.totalNo2 }}</p>
      </div>

      <div class="result-box">
        <h4>Total CH₄</h4>
        <p>{{ result?.totalCh4 }}</p>
      </div>

      <div class="result-box highlight">
        <h4>Total Emission</h4>
        <p>{{ result?.totalEmission }}</p>
      </div>

    </div>

  </div>

</div>
