<p>city works!</p>

<div class="container">

  <!-- ================= FORM ================= -->
  <div class="card">
    <h2 class="card-title">City Master</h2>

    <form class="form-grid"
          [formGroup]="cityForm"
          (ngSubmit)="submit()">

      <div class="form-group">
        <label>City Name</label>
        <input type="text" formControlName="cityName">
      </div>

      <div class="form-group">
        <label>State Name</label>
        <input type="text" formControlName="stateName">
      </div>

      <div class="form-actions">
        <button class="save-btn" type="submit">
          {{ !cityForm.value.cityId ? 'Save' : 'Update' }}
        </button>
      </div>

    </form>
  </div>

  <!-- ================= LIST CARD ================= -->
  <div class="card">

    <!-- ✅ SEARCH MOVED HERE -->
    <form [formGroup]="searchForm">

      <div class="search-row">

        <input type="text"
               class="search-input"
               placeholder="Search city..."
               formControlName="searchText">

        <div class="search-right">
          <span>Active Only</span>

          <label class="switch">
            <input type="checkbox"
                   [checked]="onlyActive()"
                   (change)="onlyActive.set($event.target.checked)">
            <span class="slider"></span>
            
          </label>
          <button class="filter-btn">
          Filter
          </button>
        </div>


      </div>
      

    </form>

    <!-- ================= TABLE ================= -->
    <div class="table-wrapper">

      <table>
        <thead>
          <tr>
            <th>City</th>
            <th>State</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let c of cities()">
            <td>{{c.cityName}}</td>
            <td>{{c.stateName}}</td>

            <td>
              <label class="switch">
                <input type="checkbox"
                       [checked]="c.isActive"
                       (change)="toggleActive(c)">
                <span class="slider"></span>
              </label>
            </td>

            <td class="actions">
              <button class="edit-btn" (click)="edit(c)">Edit</button>
              <button class="delete-btn" (click)="deleteUI(c)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>

    </div>

    <!-- ================= PAGINATION ================= -->
    <div class="pagination-info">

      <div>
        Showing {{startRecord}} to {{endRecord}}
        of {{totalRecords()}} entries
      </div>

      <div class="pagination-controls">
        <button (click)="previousPage()" [disabled]="currentPage()===1">
          Previous
        </button>

        Page {{currentPage()}} of {{totalPages()}}

        <button (click)="nextPage()"
                [disabled]="currentPage()===totalPages()">
          Next
        </button>
      </div>

    </div>

  </div>

</div>
