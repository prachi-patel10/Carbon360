<div class="container">

  <!-- ================= CREATE / EDIT FORM ================= -->
  <div class="card">
    <form [formGroup]="vehicleForm" class="form-grid" (ngSubmit)="submit()">

      <div class="form-group">
        <label>Vehicle Type Name</label>
        <input type="text" formControlName="vehicle_type_name" />
      </div>

      <div class="form-group">
        <label>Vehicle Category</label>
        <select formControlName="categoryId">
          <option value="">Select Category</option>
          <option value="1">LDV</option>
          <option value="2">MDV</option>
          <option value="3">HDV</option>
        </select>
      </div>

      <div class="form-group">
        <label>Description</label>
        <input type="text" formControlName="description" />
      </div>

      <div class="form-actions">
        <button type="submit" class="save-btn">
          {{ !vehicleForm.value.vehicle_type_id ? 'Save' : 'Update' }}
        </button>
      </div>

    </form>
  </div>

  <!-- ================= SEARCH + FILTER ================= -->
  <div class="card">

    <div class="search-row">

      <div class="search-left">
        <input
          type="text"
          placeholder="Search vehicle type..."
          formControlName="searchText"
          [formGroup]="searchForm"
          class="search-input">
      </div>

      <div class="search-right">

        <div class="active-toggle">
          <span>Active Only</span>
          <label class="switch">
            <input
              type="checkbox"
              [checked]="onlyActive()"
              (change)="onlyActive.set($event.target.checked)">
            <span class="slider"></span>
          </label>
        </div>

        <button class="filter-btn">
          Filter
        </button>

      </div>
    </div>

    <!-- ================= TABLE ================= -->
    <div class="table-wrapper">
      <table>

        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Description</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let v of vehicleTypes()">

            <td>{{ v.vehicle_type_name }}</td>
            <td>{{ v.categoryName }}</td>
            <td>{{ v.description }}</td>

            <td>
              <label class="switch">
                <input
                  type="checkbox"
                  [checked]="v.isActive"
                  (change)="toggleActive(v)">
                <span class="slider"></span>
              </label>
            </td>

            <td class="actions">
              <button class="edit-btn" (click)="edit(v)">Edit</button>
              <button class="delete-btn" (click)="deleteUI(v)">Delete</button>
            </td>

          </tr>
        </tbody>

      </table>
    </div>

    <!-- ================= PAGINATION ================= -->
    <div class="pagination-info">
      <span>Total Records: {{ totalRecords() }}</span>

      <div class="pagination-controls">
        <button (click)="previousPage()">Previous</button>
        <span>Page {{ currentPage() }} of {{ totalPages() }}</span>
        <button (click)="nextPage()">Next</button>
      </div>
    </div>

  </div>

</div>
