<div class="charts-container">
  <!-- Bar Chart -->
  <div class="chart-row">
    <div class="chart-left">
      <h3>Bar Chart</h3>
      <p>This chart shows monthly sales from January to May.</p>
      <canvas id="barChart"></canvas>
    </div>
  </div>

  <!-- Line Chart -->
  <div class="chart-row">
    <div class="chart-left">
      <h3>Line Chart</h3>
      <p>This chart displays daily visitors trend across the week.</p>
      <canvas id="lineChart"></canvas>
    </div>
  </div>

  <!-- Pie Chart -->
  <div class="chart-row">
    <div class="chart-left">
      <h3>Pie Chart</h3>
      <p>This chart represents browser market share distribution.</p>
      <canvas id="pieChart"></canvas>
    </div>
  </div>
</div>
