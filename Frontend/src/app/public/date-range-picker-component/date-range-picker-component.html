<div class="range-wrapper">

  <!-- Trigger -->
  <div class="range-input" [class.active]="showPicker" (click)="togglePicker()">
    <i class="fas fa-calendar"></i>
    <ng-container *ngIf="selectedStart && selectedEnd; else emptyPlaceholder">
      <span class="date-display">
        {{ selectedStart | date:'dd MMM yyyy' }} &mdash;
        {{ selectedEnd | date:'dd MMM yyyy' }}
      </span>
      <span class="clear-x" (click)="$event.stopPropagation(); clearRange()">✕</span>
    </ng-container>
    <ng-template #emptyPlaceholder>
      <span class="placeholder-text">Select date range</span>
      <span class="cal-arrow">&#9660;</span>
    </ng-template>
  </div>

  <!-- Popup -->
  <div class="range-popup" *ngIf="showPicker">

    <div class="popup-header">
      <span>Select date range</span>
      <span class="close-x" (click)="pickerState.close()">✕</span>
    </div>

    <div class="popup-body">

      <!-- Date inputs -->
      <div class="date-fields">
        <div class="date-field">
          <label>From</label>
          <input type="date" [max]="today" [value]="fromValue"
            (change)="onFromChange($event)" />
        </div>
        <div class="date-field">
          <label>To</label>
          <input type="date" [max]="today" [value]="toValue"
            (change)="onToChange($event)" />
        </div>
      </div>

      <!-- Quick ranges -->
      <div class="divider-row">
        <div class="divider-line"></div>
        <span class="divider-label">quick select</span>
        <div class="divider-line"></div>
      </div>

      <div class="quick-ranges">
        <button type="button" class="qr-btn"
          [class.active]="activeQuick === 'today'"
          (click)="setQuickRange('today')">Today</button>
        <button type="button" class="qr-btn"
          [class.active]="activeQuick === 'week'"
          (click)="setQuickRange('week')">This week</button>
        <button type="button" class="qr-btn"
          [class.active]="activeQuick === 'month'"
          (click)="setQuickRange('month')">This month</button>
        <button type="button" class="qr-btn"
          [class.active]="activeQuick === 'quarter'"
          (click)="setQuickRange('quarter')">Last 3 months</button>
        <button type="button" class="qr-btn"
          [class.active]="activeQuick === 'year'"
          (click)="setQuickRange('year')">This year</button>
      </div>

    </div>
  </div>

</div>
