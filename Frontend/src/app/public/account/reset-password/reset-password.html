<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="col-md-4">
    <div class="card login-card shadow-lg border-0 rounded-4">
      <div class="card-body p-4">

        <div class="brand">
          <h1>CARBON<span>360</span></h1>
          <p>Set a new password</p>
        </div>

        <div *ngIf="message" class="alert alert-success text-center">
          {{ message }} Redirecting to login...
        </div>

        <div *ngIf="error && !form.dirty" class="alert alert-danger text-center">
          {{ error }}
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!message">
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" formControlName="NewPassword"
              placeholder="Minimum 6 characters" />
            <small class="text-danger"
              *ngIf="form.get('NewPassword')?.touched && form.get('NewPassword')?.hasError('required')">
              Password is required
            </small>
            <small class="text-danger"
              *ngIf="form.get('NewPassword')?.touched && form.get('NewPassword')?.hasError('minlength')">
              Minimum 6 characters
            </small>
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" formControlName="ConfirmPassword"
              placeholder="Repeat new password" />
            <small class="text-danger"
              *ngIf="form.get('ConfirmPassword')?.touched && passwordMismatch">
              Passwords do not match
            </small>
          </div>

          <button type="submit" class="btn login-btn w-100"
            [disabled]="form.invalid || passwordMismatch || loading">
            {{ loading ? 'Resetting...' : 'Reset Password' }}
          </button>
        </form>

        <div class="text-center mt-3">
          <a routerLink="/login" class="register-footer-link" style="font-size:13px;">
            ← Back to Login
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
