<body class="register-page">
  <div class="register-overlay"></div>

  <div class="container vh-100 d-flex justify-content-center align-items-center position-relative">
    <div class="col-lg-8">
      <div class="card register-card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">

          <h4 class="text-center mb-2 register-title">
            <span class="register-icon">🌿</span> Create Account
          </h4>
          <p class="text-center mb-4 register-subtitle">
            Join Carbon 360 and start tracking emissions
          </p>

          <form [formGroup]="userData" (ngSubmit)="registerUser()">

            <!-- Row 1: Name & Email -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label register-label">Full Name</label>
                <input type="text" formControlName="Name" class="form-control register-input" />
                <div *ngIf="userData.get('Name')?.touched && userData.get('Name')?.invalid" class="text-danger mt-1">
                  Name is required
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label register-label">Email</label>
                <input type="email" formControlName="Email" class="form-control register-input" />
                <div *ngIf="userData.get('Email')?.touched && userData.get('Email')?.invalid" class="text-danger mt-1">
                  Valid email is required
                </div>
              </div>
            </div>

            <!-- Row 2: Password & Confirm Password -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label register-label">Password</label>
                <div class="position-relative">
                  <input [type]="showPassword ? 'text' : 'password'" formControlName="Password"
                    class="form-control register-input pe-5" />
                  <span class="password-toggle" (click)="showPassword = !showPassword">
                    <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                  </span>
                </div>
                <div *ngIf="userData.get('Password')?.touched && userData.get('Password')?.errors?.['required']"
                  class="text-danger mt-1">
                  Password is required
                </div>
                <div *ngIf="userData.get('Password')?.touched && userData.get('Password')?.errors?.['minlength']"
                  class="text-danger mt-1">
                  Minimum 6 characters required
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label register-label">Confirm Password</label>
                <div class="position-relative">
                  <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="ConfirmPassword"
                    class="form-control register-input pe-5" />
                  <span class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword">
                    <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                  </span>
                </div>
                <div *ngIf="userData.hasError('passwordMismatch') && userData.get('ConfirmPassword')?.touched"
                  class="text-danger mt-1">
                  Passwords do not match
                </div>
              </div>
            </div>


            <!-- Row 3: Department & Role -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label register-label">Department</label>
                <select class="form-select register-input" formControlName="DepartmentId">
                  <option value="">Select Department</option>
                  <option *ngFor="let dept of departments" [value]="dept.id">{{ dept.departmentName }}</option>
                </select>
                <div *ngIf="userData.get('DepartmentId')?.touched && userData.get('DepartmentId')?.invalid"
                  class="text-danger mt-1">
                  Department is required
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label register-label">Roles</label>
                <select class="form-select register-input" formControlName="RoleIds" multiple size="3">
                  <option *ngFor="let role of roles" [value]="role.roleId">{{ role.roleName }}</option>
                </select>
                <div *ngIf="userData.get('RoleIds')?.touched && userData.get('RoleIds')?.invalid"
                  class="text-danger mt-1">
                  Please select at least one role
                </div>
                <small class="text-muted" *ngIf="userData.get('RoleIds')?.value?.length">
                  Selected roles: {{ selectedRoleNames }}
                </small>

              </div>
            </div> <!-- Close Row 3 -->



            <!-- Row 4: Active Status -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" formControlName="IsActive">
                  <label class="form-check-label ms-2">
                    {{ userData.get('IsActive')?.value ? 'Active' : 'Inactive' }}
                  </label>
                </div>
              </div>
            </div>

            <!-- Submit Button -->
            <button class="btn register-btn w-100 mt-3" type="submit" [disabled]="userData.invalid">
              Register
            </button>

           

          </form>

        </div>
      </div>
    </div>
  </div>
</body>
