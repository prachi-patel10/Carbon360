<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="login-page">
  <div class="login-overlay"></div>

  <div class="container vh-100 d-flex justify-content-center align-items-center position-relative">
    <div class="col-md-4">
      <div class="card login-card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
           <div class="brand" >
    <h1>CARBON<span>360</span></h1>
    <p>Track • Analyze • Improve</p>
  </div>

          <!-- <p class="text-center mb-4 subtitle-text">Enter your credentials</p> -->

          <form [formGroup]="loginData" (ngSubmit)="login()">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="text" class="form-control" formControlName="Email" placeholder="Enter Email" />
              <small class="text-danger"
                *ngIf="loginData.get('Email')?.touched && loginData.get('Email')?.hasError('required')">
                Email is required
              </small>
            </div>

           <div class="mb-3 position-relative">
  <label class="form-label">Password</label>

  <input
    [type]="showPassword ? 'text' : 'password'"
    class="form-control pe-5"
    formControlName="Password"
    placeholder="Enter password"
  />

  <!-- Eye Icon -->
  <span class="password-toggle" (click)="togglePassword()">
    <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
  </span>

  <small class="text-danger"
    *ngIf="loginData.get('Password')?.touched && loginData.get('Password')?.hasError('required')">
    Password is required
  </small>
</div>

            <button type="submit" class="btn login-btn w-100" [disabled]="loginData.invalid">Login</button>
            <div class="text-center mt-3">
  <a routerLink="/forgot-password" class="register-footer-link" style="font-size:13px;">
    Forgot Password?
  </a>
</div>
          </form>

        </div>
      </div>
    </div>
  </div>
</body>

</html>
