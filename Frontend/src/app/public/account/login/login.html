<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container vh-100 d-flex justify-content-center align-items-center">
      <div class="col-md-4">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4">
            <h4 class="text-center mb-2">Login</h4>
            <p class="text-center text-muted mb-4">Enter your credentials</p>

            <form [formGroup]="loginData" (ngSubmit)="login()">
              <!-- Username -->
              <div class="mb-3">
                <label class="form-label">Username</label>

                <input
                  type="text"
                  class="form-control"
                  formControlName="UserName"
                  placeholder="Enter username"
                />

                @if (
                  loginData.get('UserName')?.touched &&
                  loginData.get('UserName')?.hasError('required')
                ) {
                  <small class="text-danger"> Username is required </small>
                }
              </div>

              <!-- Password -->
              <div class="mb-3">
                <label class="form-label">Password</label>

                <input
                  type="password"
                  class="form-control"
                  formControlName="Password"
                  placeholder="Enter password"
                />

                @if (
                  loginData.get('Password')?.touched &&
                  loginData.get('Password')?.hasError('required')
                ) {
                  <small class="text-danger"> Password is required </small>
                }
              </div>

              <!-- Login Button -->
              <button
                type="submit"
                class="btn btn-primary w-100 mt-2"
                [disabled]="loginData.invalid"
              >
                Login
              </button>

              <!-- Register Link -->
              <div class="text-center mt-3">
                <small>
                  Not registered?
                  <a routerLink="/register" class="text-decoration-none fw-semibold">
                    Create account
                  </a>
                </small>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
