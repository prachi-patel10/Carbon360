<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="login-page">
  <div class="login-overlay"></div>

  <div class="container vh-100 d-flex justify-content-center align-items-center position-relative">
    <div class="col-md-4">
      <div class="card login-card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
          <h4 class="text-center mb-2 welcome-title">
            <span class="wave">👋</span> Welcome Back
          </h4>
          <p class="text-center mb-4 subtitle-text">Enter your credentials</p>

          <form [formGroup]="loginData" (ngSubmit)="login()">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="text" class="form-control" formControlName="Email" placeholder="Enter Email" />
              <small class="text-danger"
                *ngIf="loginData.get('Email')?.touched && loginData.get('Email')?.hasError('required')">
                Email is required
              </small>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" formControlName="Password" placeholder="Enter password" />
              <small class="text-danger"
                *ngIf="loginData.get('Password')?.touched && loginData.get('Password')?.hasError('required')">
                Password is required
              </small>
            </div>

            <button type="submit" class="btn login-btn w-100" [disabled]="loginData.invalid">Login</button>
             <div class="text-center mt-3">
              <small class="register-footer-text">
                Don't Have Account <a routerLink="/register" class="register-footer-link">Register here</a>
              </small>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</body>

</html>
