<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="col-md-4">
    <div class="card login-card shadow-lg border-0 rounded-4">
      <div class="card-body p-4">

        <div class="brand">
          <h1>CARBON<span>360</span></h1>
          <p>Reset your password</p>
        </div>

        <!-- ✅ Success Message -->
        <div *ngIf="message" class="alert alert-success text-center">
          <div style="font-size:20px;">📧</div>
          <strong>Email Sent!</strong>
          <p class="mb-0 mt-1" style="font-size:13px;">{{ message }}</p>
        </div>

        <!-- ✅ Error Message -->
        <div *ngIf="error" class="alert alert-danger text-center">
          <div style="font-size:20px;">❌</div>
          <strong>Not Found!</strong>
          <p class="mb-0 mt-1" style="font-size:13px;">{{ error }}</p>
        </div>

        <!-- Form -->
        <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!message">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" formControlName="Email"
              placeholder="Enter your registered email" />
            <small class="text-danger"
              *ngIf="form.get('Email')?.touched && form.get('Email')?.hasError('required')">
              Email is required
            </small>
            <small class="text-danger"
              *ngIf="form.get('Email')?.touched && form.get('Email')?.hasError('email')">
              Enter a valid email
            </small>
          </div>

          <button type="submit" class="btn login-btn w-100" [disabled]="form.invalid || loading">
            <span *ngIf="!loading">Send Reset Link</span>
            <span *ngIf="loading">
              <span class="spinner-border spinner-border-sm me-2"></span>
              Sending...
            </span>
          </button>
        </form>

        <!-- Try again button after error -->
        <div *ngIf="error" class="text-center mt-2">
          <button class="btn login-btn w-100" (click)="resetForm()">
            Try Again
          </button>
        </div>

        <div class="text-center mt-3">
          <a routerLink="/login" class="register-footer-link" style="font-size:13px;">
            ← Back to Login
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
